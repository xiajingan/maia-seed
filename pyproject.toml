[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maia-seed"
version = "0.2.0"
description = "Maia shared backend runtime foundations"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
security = ["cryptography>=44,<51"]
oceanbase = ["asyncmy>=0.2.10,<1", "sqlalchemy[asyncio]>=2.0.36,<3"]

[dependency-groups]
dev = [
  "asyncmy>=0.2.10,<1",
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seed = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".harness", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "C90", "SIM"]
mccabe.max-complexity = 10

[tool.pytest.ini_options]
addopts = "--cov=seed --cov-report=term-missing --cov-fail-under=80 -m 'not integration'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires an external service"]

[tool.coverage.run]
branch = true
source = ["seed"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "\\.\\.\\."]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/seed"]
exclude = ['^\\.harness/', '^build/', '^dist/']
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
