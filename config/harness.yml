# 重建期：业务命令待真实实现，缺失时门禁应阻断；不得用空壳宣称交付。
version: 2
project:
  id: maia-seed
  mode: managed
  type: library
  deployment_owner: control
agent_runtime:
  primary: codex
  compatibility:
  - agy
  - copilot
ai_platform:
- codex
- agy
- copilot
task_execution:
  max_review_retries: 5
automation:
  enabled: true
  default_mode: report-only
  state_dir: .harness/automation
  lock_ttl_seconds: 3600
  max_fix_attempts: 2
  autonomy:
    enabled: false
    mode: report-only
    allowed_jobs:
    - doc-garden
    allowed_severities:
    - low
    protected_paths:
    - src/auth
    - migrations
    - config/deploy.yml
    - .github
    - .gitlab
    fix_commands: {}
walkthrough_env: development
gates:
  ui_design_l3: false
  quality_threshold: 95
  require_e2e: false
deploy:
  build_image_enabled: false
  test_mode: cloud-native
  prod_mode: cloud-native
commands:
  data_lint:
  - '{harness}'
  - data-lint
  dev: []
  lint: []
  format_check: []
  typecheck: []
  architecture: []
  unit: []
  integration: []
  package_build: []
  frontend_lint: []
  frontend_typecheck: []
  frontend_unit: []
  e2e: []
  doc_lint:
  - '{harness}'
  - doc-lint
  requirements_validate:
  - '{harness}'
  - requirements
  - validate
  build: []
command_groups:
  static:
  - data_lint
  - lint
  - typecheck
  precommit:
  - data_lint
  - requirements_validate
  - doc_lint
  ci:
  - data_lint
  - lint
  - typecheck
  - unit
  - build
management:
  control_id: maia
  control_path: ..
  intake_policy: manual-planning
  assignment_inbox: docs/assignments/inbox
  assignment_responses: docs/assignments/responses
  deliveries_dir: docs/deliveries
planning:
  minimum_bootstrap_domains: 3
  bootstrap_completion_receipt: docs/architecture/bootstrap-completion.yml
  project_stage: greenfield
architecture:
  profile: simple-layered
observability:
  required_assets:
  - dashboards
  - alerts
  - queries
  - runbooks
