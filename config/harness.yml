version: 2
project:
  id: maia-seed
  mode: managed
  stack: python-backend
  deployment_owner: control
agent_runtime:
  primary: codex
  compatibility:
  - agy
  - copilot
ai_platform:
- codex
- agy
- copilot
automation:
  enabled: true
  default_mode: report-only
  state_dir: .harness/automation
  lock_ttl_seconds: 3600
  max_fix_attempts: 2
  autonomy:
    enabled: false
    mode: report-only
    allowed_jobs:
    - doc-garden
    allowed_severities:
    - low
    protected_paths:
    - src/auth
    - migrations
    - config/deploy.yml
    - .github
    - .gitlab
    fix_commands: {}
walkthrough_env: development
gates:
  ui_design_l3: false
  quality_threshold: 95
  require_e2e: false
deploy:
  test_mode: docker
  prod_mode: docker
commands:
  format_check: [uv, run, --frozen, python, -m, ruff, format, --check, .]
  lint: [uv, run, --frozen, python, -m, ruff, check, .]
  typecheck: [uv, run, --frozen, python, -m, mypy, src/seed]
  architecture: [uv, run, --frozen, python, -m, pytest, -q, tests/architecture, --no-cov]
  unit: [uv, run, --frozen, python, -m, pytest, -q]
  integration: [uv, run, --frozen, python, -m, pytest, -q, tests/integration, -m, integration, --no-cov]
  dependency_audit: [uv, run, --frozen, pip-audit, --skip-editable]
  build: [uv, build]
  frontend_lint: []
  frontend_typecheck: []
  frontend_unit: []
  e2e: []
command_conditions:
  format_check: {file_exists: pyproject.toml}
  lint: {file_exists: pyproject.toml}
  typecheck: {file_exists: pyproject.toml}
  architecture: {file_exists: tests/architecture/test_boundaries.py}
  unit: {file_exists: pyproject.toml}
  integration: {file_exists: tests/integration/test_fastapi_context.py}
  dependency_audit: {file_exists: uv.lock}
  build: {file_exists: pyproject.toml}
command_groups:
  static: [format_check, lint, typecheck, architecture]
  precommit: [format_check, lint, typecheck, architecture, unit, build]
  security: [dependency_audit]
python_architecture:
  source_roots: [src]
  layers:
    seed: {directories: [seed], allow: [seed]}
management:
  control_id: maia
  control_path: ..
  intake_policy: manual-planning
  assignment_inbox: docs/assignments/inbox
  assignment_responses: docs/assignments/responses
  deliveries_dir: docs/deliveries
